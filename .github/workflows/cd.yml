name: CD

on:
  workflow_dispatch:
    inputs:
      bootstrap_server:
        description: "Allow first-time server bootstrap and create the server identity marker if it is absent."
        required: true
        default: false
        type: boolean
      recreate_stateful_services:
        description: "Allow explicit recreation of postgres and redis containers."
        required: true
        default: false
        type: boolean
      run_database_maintenance:
        description: "Allow explicit PostgreSQL/Redis maintenance: startup checks, grants refresh and schema migrations."
        required: true
        default: false
        type: boolean
      git_ref:
        description: "Git ref to deploy manually."
        required: false
        default: "main"
        type: string
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        vars.ENABLE_AUTO_DEPLOY == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_HOST_KEY_ALIAS: ${{ vars.DEPLOY_HOST_KEY_ALIAS }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
      ADMIN_BASE_PATH: ${{ vars.ADMIN_BASE_PATH }}
      VITE_DYNAMIC_BACKDROP: ${{ vars.VITE_DYNAMIC_BACKDROP }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.git_ref }}

      - name: Resolve release metadata
        shell: bash
        run: |
          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ] || [ -z "${PRODUCTION_DOMAIN}" ]; then
            echo "DEPLOY_HOST, DEPLOY_USER and PRODUCTION_DOMAIN must be configured as production environment variables." >&2
            exit 1
          fi

          echo "RELEASE_SHA=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=${DEPLOY_PORT:-22}" >> "$GITHUB_ENV"
          echo "DEPLOY_HOST_KEY_ALIAS=${DEPLOY_HOST_KEY_ALIAS:-$PRODUCTION_DOMAIN}" >> "$GITHUB_ENV"
          echo "ADMIN_BASE_PATH=${ADMIN_BASE_PATH:-/admin/}" >> "$GITHUB_ENV"
          echo "VITE_DYNAMIC_BACKDROP=${VITE_DYNAMIC_BACKDROP:-true}" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_SERVER=${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_server || 'false' }}" >> "$GITHUB_ENV"
          echo "RECREATE_STATEFUL_SERVICES=${{ github.event_name == 'workflow_dispatch' && inputs.recreate_stateful_services || 'false' }}" >> "$GITHUB_ENV"
          echo "RUN_DATABASE_MAINTENANCE=${{ github.event_name == 'workflow_dispatch' && inputs.run_database_maintenance || 'false' }}" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "${DEPLOY_SSH_PRIVATE_KEY}" ]; then
            echo "DEPLOY_SSH_PRIVATE_KEY secret is not configured." >&2
            exit 1
          fi

          if [ -z "${DEPLOY_SSH_KNOWN_HOSTS}" ]; then
            echo "DEPLOY_SSH_KNOWN_HOSTS secret is not configured." >&2
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_PORT}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            HostKeyAlias ${DEPLOY_HOST_KEY_ALIAS}
            ServerAliveInterval 30
            ServerAliveCountMax 10
            TCPKeepAlive yes
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      - name: Build API image
        run: docker build -f backend/Dockerfile --build-arg "RELEASE_SHA=${RELEASE_SHA}" -t "portfolio-api:${RELEASE_SHA}" .

      - name: Build Nginx image
        run: |
          docker build -f infrastructure/nginx/Dockerfile \
            --build-arg "RELEASE_SHA=${RELEASE_SHA}" \
            --build-arg "VITE_PUBLIC_API_BASE_URL=https://${PRODUCTION_DOMAIN}/api/public" \
            --build-arg "VITE_ADMIN_API_BASE_URL=https://${PRODUCTION_DOMAIN}/api/admin" \
            --build-arg "VITE_ENABLE_DYNAMIC_BACKDROP=${VITE_DYNAMIC_BACKDROP}" \
            --build-arg "VITE_ADMIN_BASE_PATH=${ADMIN_BASE_PATH}" \
            -t "portfolio-web-nginx:${RELEASE_SHA}" \
            .

      - name: Package deployment bundle and images
        shell: bash
        run: |
          mkdir -p artifacts/deploy

          tar -czf "artifacts/deploy/portfolio-deploy-bundle-${RELEASE_SHA}.tar.gz" \
            docker-compose.production.yml \
            infrastructure/postgres/init \
            scripts/deploy \
            scripts/postgres

          docker save "portfolio-api:${RELEASE_SHA}" | gzip > "artifacts/deploy/portfolio-api-${RELEASE_SHA}.tar.gz"
          docker save "portfolio-web-nginx:${RELEASE_SHA}" | gzip > "artifacts/deploy/portfolio-web-nginx-${RELEASE_SHA}.tar.gz"

      - name: Write production env files
        shell: bash
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          DEPLOY_SERVER_ID: ${{ secrets.DEPLOY_SERVER_ID }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        run: |
          printf '%s\n' "${PRODUCTION_ENV_FILE}" > artifacts/deploy/portfolio-production.env

          {
            printf 'RELEASE_SHA=%q\n' "${RELEASE_SHA}"
            printf 'DEPLOY_SERVER_ID=%q\n' "${DEPLOY_SERVER_ID}"
            printf 'TARGET_DOMAIN_NAME=%q\n' "${PRODUCTION_DOMAIN}"
            printf 'TARGET_LETSENCRYPT_EMAIL=%q\n' "${LETSENCRYPT_EMAIL}"
            printf 'BOOTSTRAP_SERVER=%q\n' "${BOOTSTRAP_SERVER}"
            printf 'RECREATE_STATEFUL_SERVICES=%q\n' "${RECREATE_STATEFUL_SERVICES}"
            printf 'RUN_DATABASE_MAINTENANCE=%q\n' "${RUN_DATABASE_MAINTENANCE}"
            printf 'BUNDLE_ARCHIVE=%q\n' "/tmp/portfolio-deploy-bundle-${RELEASE_SHA}.tar.gz"
            printf 'API_IMAGE_ARCHIVE=%q\n' "/tmp/portfolio-api-${RELEASE_SHA}.tar.gz"
            printf 'NGINX_IMAGE_ARCHIVE=%q\n' "/tmp/portfolio-web-nginx-${RELEASE_SHA}.tar.gz"
            printf 'ENV_ARCHIVE=%q\n' "/tmp/portfolio-production.env"
          } > artifacts/deploy/portfolio-deploy-meta.env

      - name: Upload deployment artifacts to the server
        shell: bash
        run: |
          scp \
            "artifacts/deploy/portfolio-deploy-bundle-${RELEASE_SHA}.tar.gz" \
            "artifacts/deploy/portfolio-api-${RELEASE_SHA}.tar.gz" \
            "artifacts/deploy/portfolio-web-nginx-${RELEASE_SHA}.tar.gz" \
            "artifacts/deploy/portfolio-production.env" \
            "artifacts/deploy/portfolio-deploy-meta.env" \
            "deploy-target:/tmp/"

      - name: Run remote deployment
        shell: bash
        run: |
          scp scripts/deploy/remote-deploy.sh "deploy-target:/tmp/portfolio-remote-deploy.sh"
          ssh deploy-target \
            "tr -d '\r' < /tmp/portfolio-remote-deploy.sh > /tmp/portfolio-remote-deploy.sh.lf && mv /tmp/portfolio-remote-deploy.sh.lf /tmp/portfolio-remote-deploy.sh && chmod 700 /tmp/portfolio-remote-deploy.sh && set -a && . /tmp/portfolio-deploy-meta.env && set +a && /bin/sh /tmp/portfolio-remote-deploy.sh"

      - name: Show current containers
        if: success()
        shell: bash
        run: |
          ssh deploy-target \
            "if command -v sudo >/dev/null 2>&1; then sudo docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'; else docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'; fi"

      - name: Upload deployment package
        if: always() && hashFiles('artifacts/deploy/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-${{ env.RELEASE_SHA }}
          path: artifacts/deploy
          if-no-files-found: ignore

      - name: Write deployment summary
        if: success()
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "- Domain: https://${PRODUCTION_DOMAIN}"
            echo "- Release SHA: ${RELEASE_SHA}"
            echo "- Bootstrap mode: ${BOOTSTRAP_SERVER}"
            echo "- Database maintenance: ${RUN_DATABASE_MAINTENANCE}"
            echo "- HTTPS certificate requested and nginx reloaded."
          } >> "$GITHUB_STEP_SUMMARY"
