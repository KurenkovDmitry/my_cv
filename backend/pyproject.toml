[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-backend"
version = "0.1.0"
description = "FastAPI backend for the portfolio platform."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "redis>=5.0,<6.0",
  "structlog>=24.4,<25.0",
  "pyjwt>=2.9,<3.0",
  "argon2-cffi>=23.1,<24.0",
  "httpx>=0.28,<1.0",
  "python-multipart>=0.0.12,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pip-audit>=2.8,<3.0",
  "ruff>=0.7,<1.0",
  "mypy>=1.11,<2.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "app/modules"]

[tool.ruff]
line-length = 100
