services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_SUPERUSER_NAME}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    ports:
      - "5432:5432"
    mem_limit: 1024m
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    mem_limit: 256m
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PUBLIC_FRONTEND_ORIGIN: ${PUBLIC_FRONTEND_ORIGIN}
      ADMIN_FRONTEND_ORIGIN: ${ADMIN_FRONTEND_ORIGIN}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB_NAME: ${POSTGRES_DB_NAME}
      DB_APP_READ_USERNAME: ${DB_APP_READ_USERNAME}
      DB_APP_READ_PASSWORD: ${DB_APP_READ_PASSWORD}
      DB_APP_WRITE_USERNAME: ${DB_APP_WRITE_USERNAME}
      DB_APP_WRITE_PASSWORD: ${DB_APP_WRITE_PASSWORD}
      DB_APP_ADMIN_USERNAME: ${DB_APP_ADMIN_USERNAME}
      DB_APP_ADMIN_PASSWORD: ${DB_APP_ADMIN_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      REDIS_PUBLIC_PORTFOLIO_TTL_SECONDS: ${REDIS_PUBLIC_PORTFOLIO_TTL_SECONDS}
      REDIS_PROJECT_LIST_TTL_SECONDS: ${REDIS_PROJECT_LIST_TTL_SECONDS}
      AUTH_LOGIN_RATE_LIMIT_COUNT: ${AUTH_LOGIN_RATE_LIMIT_COUNT}
      AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS}
      AUTH_IP_RATE_LIMIT_COUNT: ${AUTH_IP_RATE_LIMIT_COUNT}
      AUTH_IP_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_IP_RATE_LIMIT_WINDOW_SECONDS}
      AUTH_API_RATE_LIMIT_COUNT: ${AUTH_API_RATE_LIMIT_COUNT}
      AUTH_API_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_API_RATE_LIMIT_WINDOW_SECONDS}
      AUTH_LOCKOUT_BASE_SECONDS: ${AUTH_LOCKOUT_BASE_SECONDS}
      AUTH_LOCKOUT_MAX_SECONDS: ${AUTH_LOCKOUT_MAX_SECONDS}
      AUTH_RATE_LIMIT_KEY_PEPPER: ${AUTH_RATE_LIMIT_KEY_PEPPER}
      ANALYTICS_SESSION_DAILY_RETENTION_DAYS: ${ANALYTICS_SESSION_DAILY_RETENTION_DAYS}
      ANALYTICS_SECTION_VIEW_DAILY_RETENTION_DAYS: ${ANALYTICS_SECTION_VIEW_DAILY_RETENTION_DAYS}
      ANALYTICS_SECTION_CLICK_DAILY_RETENTION_DAYS: ${ANALYTICS_SECTION_CLICK_DAILY_RETENTION_DAYS}
      ANALYTICS_EVENT_DEDUPE_WINDOW_SECONDS: ${ANALYTICS_EVENT_DEDUPE_WINDOW_SECONDS}
      ANALYTICS_SESSION_DEDUPE_WINDOW_SECONDS: ${ANALYTICS_SESSION_DEDUPE_WINDOW_SECONDS:-43200}
      ANALYTICS_TRACK_NON_PRODUCTION: ${ANALYTICS_TRACK_NON_PRODUCTION:-false}
      ANALYTICS_SPIKE_THRESHOLD: ${ANALYTICS_SPIKE_THRESHOLD}
      ANALYTICS_SPIKE_WINDOW_SECONDS: ${ANALYTICS_SPIKE_WINDOW_SECONDS}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS}
      BACKUP_STORAGE_PATH: ${BACKUP_STORAGE_PATH}
      CONTENT_ASSET_STORAGE_PATH: ${CONTENT_ASSET_STORAGE_PATH:-/opt/portfolio/assets}
      CONTENT_ASSET_MAX_BYTES: ${CONTENT_ASSET_MAX_BYTES:-20971520}
      IMPORT_CANDIDATE_RETENTION_DAYS: ${IMPORT_CANDIDATE_RETENTION_DAYS}
      ENABLE_GRAFANA_INTEGRATION: ${ENABLE_GRAFANA_INTEGRATION}
    volumes:
      - portfolio-backups:${BACKUP_STORAGE_PATH}
      - portfolio-assets:${CONTENT_ASSET_STORAGE_PATH:-/opt/portfolio/assets}
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    mem_limit: 768m

  grafana:
    image: grafana/grafana:13.0.2
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-grafana-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana-admin}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB_NAME: ${POSTGRES_DB_NAME}
      DB_APP_READ_USERNAME: ${DB_APP_READ_USERNAME}
      DB_APP_READ_PASSWORD: ${DB_APP_READ_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - postgres
    expose:
      - "3000"
    mem_limit: 384m

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - grafana
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/site.conf.template:/etc/nginx/templates/default.conf.template:ro
    mem_limit: 128m

volumes:
  postgres-data:
  redis-data:
  portfolio-backups:
  portfolio-assets:
  grafana-data:
