[project]
name = "portfolio-cv-importer"
version = "0.1.0"
description = "CV importer and exporter that converts resume-like documents into portfolio.v1."
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
portfolio-cv-convert = "portfolio_cv_importer.api.cli.convert_source_to_portfolio:main"
portfolio-cv-export = "portfolio_cv_importer.api.cli.export_portfolio_document:main"

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
