[project]
name = "portfolio-cv-importer"
version = "0.1.0"
description = "CV importer that prepares portfolio.import.draft.yaml."
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "python-docx>=1.1,<2.0",
  "pypdf>=5.0,<6.0",
  "beautifulsoup4>=4.12,<5.0",
  "markdown>=3.7,<4.0"
]

[project.optional-dependencies]
ocr = [
  "pillow>=10.4,<11.0",
  "pytesseract>=0.3.13,<1.0"
]

